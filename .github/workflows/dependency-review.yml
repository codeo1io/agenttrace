name: Dependency Review

on:
  # The dependency-review action needs the repository Dependency graph,
  # which is disabled on this fork (settings/security_analysis — no API
  # toggle exists). Manual-only until the graph is enabled; the lockfile
  # scan in ci.yml (cargo audit + cargo deny) covers the same ground.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency review
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
