name: Dependency Review

on:
  # The dependency-review action needs the repository Dependency graph,
  # which is disabled on this fork (settings/security_analysis — no API
  # toggle exists). Manual-only until the graph is enabled; the lockfile
  # policy scan in ci.yml (cargo-deny, the "Dependency policy" job) covers
  # the lockfile side. cargo audit is not wired anywhere in this repo.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Review dependency changes
        # workflow_dispatch is this workflow's only trigger, so the fork-PR
        # guards that used to wrap this step were dead branches — PR events
        # never reach it (rm-168). On a manual dispatch against a fork with
        # the dependency graph disabled, this step fails with an auth error;
        # that failure is the honest signal until the graph is enabled. If a
        # pull_request trigger is ever restored, re-add the fork guard:
        #   if: github.event_name != 'pull_request'
        #      || github.event.pull_request.head.repo.fork == false
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
