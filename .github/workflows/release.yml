name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release sources
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          # rm-173: aligned with rust-toolchain.toml (the toolchain file
          # overrides this input for every cargo step in the repo).
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked -p agenttrace-core -p agenttrace-tui -p agenttrace --all-targets -- -D warnings

      - name: Rust tests (locked)
        run: cargo test --locked -p agenttrace-core -p agenttrace-tui -p agenttrace

      - name: Release glibc floor gate (self-test)
        # rm-2248: the release workflow consumes check-glibc-floor.sh one
        # job below this one; prove the gate's own fixtures (red-first on
        # a GLIBC_2.39 asset) inside the release pipeline too, so a CI
        # lane regression cannot leave the release gate unexercised.
        run: scripts/ci/check-glibc-floor.sh --self-test

  build-linux:
    name: Build release assets (linux)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # rm-2248: Linux assets build inside a pinned container so the glibc
    # baseline they carry is decoupled from the hosted runner image
    # lifecycle — ubuntu-latest began flipping to 26.04 on 2026-10-19
    # (actions/runner-images#14748) and each flip silently raised the
    # asset floor (every v0.10.1-class asset shipped requiring
    # GLIBC_2.39). The ubuntu:22.04 CONTAINER image tracks Ubuntu 22.04
    # LTS's own lifecycle, not the runner-images retirement calendar
    # (#14254 retires the 22.04 RUNNER image in 2027, not this container
    # image). A musl target stays the documented fallback if the
    # container surface ever becomes a burden — check-glibc-floor.sh
    # passes static/musl assets by design. The floor itself is enforced
    # fail-closed after the build.
    container: ubuntu:22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The arm64 asset cross-compiles on the amd64 container.
          - target: x86_64-unknown-linux-gnu
            asset: agenttrace-linux-amd64
          - target: aarch64-unknown-linux-gnu
            asset: agenttrace-linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install container toolchain
        # The bare ubuntu:22.04 image ships none of the build surface a
        # hosted image carries: gcc + binutils (`strings` backs the glibc
        # floor gate below), curl + ca-certificates for the rustup
        # install below, perl because ring's build plumbing expects it on
        # hosted images (a minimal container is the first place its
        # absence would surface). actions/checkout needs nothing here:
        # JavaScript actions execute on the host runner and reach this
        # job only through the mounted workspace.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates gcc binutils perl

      - name: Install Linux ARM linker
        # The aarch64-unknown-linux-gnu toolchain needs a cross linker.
        # The job container runs as root, so no sudo here.
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu

      - name: Install Rust toolchain (in-container)
        # rm-2248: dtolnay/rust-toolchain and Swatinem/rust-cache are
        # JavaScript actions — they run on the HOST runner, and the state
        # they write (~/.cargo, ~/.rustup, the host cache paths) never
        # reaches this container, where only `run` steps execute. A
        # JS-action toolchain here would leave the Build step without
        # cargo. rustup installs inside the container instead — the only
        # mechanism that can work under `container:` — pinned by parsing
        # rust-toolchain.toml at run time (rm-173: one home for the
        # version; the toml still outranks the rustup default for every
        # cargo invocation in this workspace, so the two cannot
        # disagree). No dependency cache: the host-path cache action is
        # useless here and release cadence does not pay for a container-
        # visible one; cold builds fit the 30-minute job timeout.
        env:
          TARGET: ${{ matrix.target }}
        run: |
          pin="$(sed -nE 's/^channel = "(.*)"/\1/p' rust-toolchain.toml)"
          [[ -n "$pin" ]] || {
            echo "release: rust-toolchain.toml carries no channel pin" >&2
            exit 1
          }
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$pin"
          . "$HOME/.cargo/env"
          rustup target add "$TARGET"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cargo --version
          rustc --version

      - name: Build
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          AGENTTRACE_RELEASE_VERSION="$release_version" \
            cargo build --release -p agenttrace --target "$TARGET" --locked
          out="$ASSET"
          exe=""
          if [[ "$TARGET" == *windows* ]]; then exe=".exe"; fi
          cp "target/$TARGET/release/agenttrace${exe}" "$out"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$out" > "${out}.sha256"
          else
            shasum -a 256 "$out" > "${out}.sha256"
          fi

      - name: Enforce glibc floor
        # rm-2248: fail-closed floor assertion on the built asset
        # (default floor 2.35 — the ubuntu:22.04 baseline, matching the
        # README system requirement). Static/musl assets carry no
        # GLIBC_ references and pass by design.
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: scripts/ci/check-glibc-floor.sh "$ASSET"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}*
          if-no-files-found: error

  build:
    name: Build release assets
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Darwin targets need the Apple SDK — build natively on macOS runners
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: agenttrace-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: agenttrace-darwin-arm64
          # MSVC targets need the MSVC toolchain — build natively on Windows runners
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: agenttrace-windows-amd64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: agenttrace-windows-arm64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          # rm-173: aligned with rust-toolchain.toml (the toolchain file
          # overrides this input for every cargo step in the repo).
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          AGENTTRACE_RELEASE_VERSION="$release_version" \
            cargo build --release -p agenttrace --target "$TARGET" --locked
          out="$ASSET"
          exe=""
          if [[ "$TARGET" == *windows* ]]; then exe=".exe"; fi
          cp "target/$TARGET/release/agenttrace${exe}" "$out"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$out" > "${out}.sha256"
          else
            shasum -a 256 "$out" > "${out}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build, build-linux, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          cat ./*.sha256 > checksums.txt
          sort -o checksums.txt checksums.txt

      - name: Attest release assets
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: dist/agenttrace-*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Pack npm launcher
        run: |
          version="${GITHUB_REF_NAME#v}"
          # shellcheck disable=SC2016
          RELEASE_VERSION="$version" node -e '
            const fs = require("fs");
            const file = "npm/package.json";
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            manifest.version = process.env.RELEASE_VERSION;
            fs.writeFileSync(file, `${JSON.stringify(manifest, null, 2)}\n`);
          '
          cd npm
          npm pack --pack-destination ../dist

      - name: Configure npm registry authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || {
            echo "NPM_TOKEN is required to publish the npm package." >&2
            exit 1
          }
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"

      - name: Publish npm launcher
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "@zack78/agenttrace@${version}" version >/dev/null 2>&1; then
            echo "@zack78/agenttrace@${version} is already published; skipping"
            exit 0
          fi
          npm publish "./dist/zack78-agenttrace-${version}.tgz" --access public --provenance

      - name: Render Homebrew Formula
        run: |
          scripts/release/render-channels.sh \
            "${GITHUB_REF_NAME#v}" \
            dist/checksums.txt \
            channel-dist

      - name: Publish Homebrew Formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          scripts/release/publish-homebrew.sh \
            "$GITHUB_REF_NAME" \
            channel-dist/homebrew/Formula/agenttrace.rb
