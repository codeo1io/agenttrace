name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint and repo contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          # rm-173: aligned with rust-toolchain.toml (the toolchain file
          # governs every cargo step; this input must name the same
          # version or the action installs a toolchain nothing runs).
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Lint workflows
        run: |
          # actionlint v1.7.12
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Clippy
        # rm-654: the wall-discipline form — test/bench/example targets
        # too. Clippy-on-lib-only let real errors rot in the lint lane
        # before; this mirrors the local gate.
        run: cargo clippy --locked -p agenttrace-core -p agenttrace-tui -p agenttrace --all-targets -- -D warnings

      - name: Validate Cargo manifests
        run: scripts/ci/check-cargo-manifests.sh

      - name: Release surface drift
        run: scripts/ci/check-release-surfaces.sh

      - name: Validate helper scripts
        run: |
          bash -n scripts/record-demo.sh scripts/ci/*.sh scripts/release/*.sh
          sh -n install.sh

      - name: Lockfile enforcement (cargo --locked)
        # rm-170 lineage: every CI cargo step runs --locked; this gate
        # makes a drifted lockfile a named failure, not a surprise.
        run: scripts/ci/check-locked-cargo.sh

      - name: Installer ref drift gate
        # rm-017: install.sh's default AGENTTRACE_SOURCE_REF must track
        # the newest CHANGELOG release heading.
        run: scripts/ci/check-install-ref-drift.sh

      - name: Codex plugin version sync
        run: |
          # rm-163: the tag anchor needs tags; a fetch-depth:1 checkout has
          # none and the anchor would silently no-op. Fetch open, gate closed.
          git fetch --tags --quiet || true
          scripts/ci/check-plugin-version.sh

      - name: Validate Homebrew formula syntax
        run: ruby -c homebrew/Formula/agenttrace.rb

      - name: Test npm package contract
        run: npm --prefix npm test

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Linux tests run under the coverage job.
        os: [macos-14, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          # rm-173: same pin as the lint job / rust-toolchain.toml.
          toolchain: "1.98.1"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Rust tests
        shell: bash
        run: cargo test --locked -p agenttrace-core -p agenttrace-tui -p agenttrace

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.89"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check
        # The repo pins rust-toolchain.toml (rm-173), which outranks the
        # action's toolchain input; the explicit +1.89 selector makes the
        # floor the version that actually compiles here.
        run: cargo +1.89 check --locked -p agenttrace-core -p agenttrace-tui -p agenttrace

  conformance:
    # rm-053, cycle 2 ("Conformance guardrail: token-accounting truth"):
    # the checked-in conformance pack (testdata/conformance/ — manifest
    # plus fixtures derived from the five audited AgentMeasure billing-bug
    # classes) runs against parser+pricing through both halves: the
    # library harness (crates/agenttrace-core/tests/token_conformance.rs,
    # which also re-derives every cost literal from the bundled pricing
    # snapshot so a snapshot refresh forces a pack refresh) and the
    # offline CLI runner (scripts/conformance/run.sh). Any silent
    # double-count, mis-price, or unprovable total fails the job.
    #
    # The pack is cheap and fully offline, so the job runs on every event
    # like `deny` — a conditionally-skipped job can never actually gate a
    # PR, and the superset also guards against token-accounting drift
    # introduced from files the acceptance did not name.
    name: Token conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          # rm-173: same pin as the lint/full jobs / rust-toolchain.toml.
          toolchain: "1.98.1"

      - name: Gate surface audit
        # rm-053: names, in the run log, whether this PR touches the
        # gated surface (parser.rs / pricing.rs) or the pack itself.
        # Best-effort on shallow checkouts; the pack runs regardless.
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --quiet --depth=250 origin "$GITHUB_BASE_REF" || true
            BASE="origin/$GITHUB_BASE_REF"
            if CHANGED=$(git diff --name-only "$BASE"...HEAD 2>/dev/null); then
              if echo "$CHANGED" | grep -E 'crates/agenttrace-core/src/(parser|pricing)\.rs'; then
                echo "conformance gate: GATED SURFACE TOUCHED (parser.rs/pricing.rs) — pack must hold"
              elif echo "$CHANGED" | grep -E '(testdata/conformance/|scripts/conformance/|crates/agenttrace-core/tests/token_conformance\.rs)'; then
                echo "conformance gate: conformance pack itself changed — self-check"
              else
                echo "conformance gate: gated surface untouched — pack still runs (guards silent token drift)"
              fi
              echo "$CHANGED" | sed 's/^/  changed: /'
            else
              echo "conformance gate: diff unavailable on this shallow checkout — pack runs unconditionally"
            fi
          else
            echo "conformance gate: non-PR event — pack runs unconditionally"
          fi

      - name: Library conformance harness
        run: cargo test --locked -p agenttrace-core --test token_conformance

      - name: Binary conformance runner
        run: |
          cargo build --locked -p agenttrace
          AGENTTRACE_BIN=target/debug/agenttrace scripts/conformance/run.sh

      - name: Validate runner script
        run: bash -n scripts/conformance/run.sh

  smoke:
    name: Release binary smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGENTTRACE_BIN: target/release/agenttrace
      AGENTTRACE_CI_OUT: ci-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          # rm-173: same pin as the lint job / rust-toolchain.toml.
          toolchain: "1.98.1"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build CLI
        run: cargo build --locked --release -p agenttrace

      - name: Demo and report output contract
        run: scripts/ci/check-output-contract.sh

      - name: Deterministic demo output
        run: scripts/ci/check-deterministic-output.sh

      - name: Report semantic consistency
        run: scripts/ci/check-report-semantics.sh

      - name: Example workflow supply-chain pinning
        run: scripts/ci/check-example-workflows.sh

      - name: Install runtime verification
        run: |
          AGENTTRACE_BIN=target/release/agenttrace \
            scripts/ci/check-install-runtime.sh

      - name: Documented command smoke tests
        run: scripts/ci/check-docs-commands.sh

      - name: Rust CLI fixture smoke
        env:
          AGENTTRACE_REAL_CLI_DIR: testdata
          AGENTTRACE_REAL_CLI_QUERY: internal/ws
          AGENTTRACE_REAL_CLI_FILE_LIMIT: "20"
          AGENTTRACE_REAL_CLI_OUT: ci-artifacts/real-cli-smoke
        run: scripts/ci/check-rust-real-cli-smoke.sh

      - name: Install expect
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Rust TUI fixture smoke
        env:
          AGENTTRACE_TUI_REAL_DIR: testdata
        run: scripts/ci/check-rust-tui-real-smoke.sh

      - name: Upload demo report artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agenttrace-ci-reports
          path: ci-artifacts
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: Test and coverage (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          # rm-173: same pin as the lint job / rust-toolchain.toml.
          toolchain: "1.98.1"
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
        with:
          tool: cargo-llvm-cov

      - name: Rust tests with coverage
        run: cargo llvm-cov --locked -p agenttrace-core -p agenttrace-tui -p agenttrace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          files: lcov.info
          disable_search: true
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          fail_ci_if_error: false

  deny:
    # rm-010, cycle 1 ("Trusted transport, gated supply chain"): dependency
    # policy gate — advisories (RUSTSEC), licenses, bans, sources — against
    # deny.toml at the repo root. Runs on every push/PR/schedule
    # (metadata-only, no compile, ~1min).
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check advisories, licenses, bans and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check
          arguments: --all-features

  # Single required status check for the master ruleset; keep this job name stable.
  gate:
    name: Test and build
    if: always()
    needs: [lint, test, msrv, conformance, smoke, coverage, deny]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all CI jobs to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [[ "$result" == "success" ]] || exit 1
          done
