name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # PR fast lane (2026-09-19): fmt + clippy only — the compile-check
    # surface, ~2min warm on the persisted cargo target. Everything else
    # (tests, release build, the smoke scripts) moved to `full`, which runs
    # on push(master), the nightly schedule, and dispatch — never on
    # pull_request. The single job used to take 560s per PR (run
    # 35105368113), dominated by the 291s release build.
    # PR-only (2026-09-19b): on master the two jobs serialize on the single
    # self-hosted runner (run 35458293806: 17:30 run start, Lint didn't get
    # the runner until 18:07 — 38min wall for 9min of work). `full` covers
    # fmt+clippy on non-PR refs via its own check step, so lint stays the
    # PR gate only.
    if: github.event_name == 'pull_request'
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          # rm-173: aligned with the repo's rust-toolchain.toml pin. The
          # toolchain file governs every cargo step below (rustup resolution:
          # toolchain file > `rustup default`), so this input must name the
          # same version or the action installs a toolchain nothing runs.
          toolchain: "1.98.1"


      # Self-hosted cargo target persistence: branch checkouts invalidate the
      # workspace target dir; a lockfile-keyed tarball under the runner's
      # persistent tool dir restores a warm tree so clippy/checks hit the
      # incremental cache (2026-09-19: clippy alone was 2m36s cold on run
      # measured; target dir is 369M).
      - name: Restore cargo target
        run: |
          KEY="cargo-$(sha256sum Cargo.lock | cut -c1-16)"
          CACHE_DIR="$RUNNER_TOOL_CACHE/../cargo-cache"
          mkdir -p "$CACHE_DIR"
          if [ -f "$CACHE_DIR/$KEY.tar" ]; then
            mkdir -p target
            # rm-170: a tar truncated by a killed save used to fail the step
            # outright — a cold build is strictly better than a red PR, so a
            # corrupt cache is deleted and the run continues cold.
            if tar -xf "$CACHE_DIR/$KEY.tar" -C .; then
              echo "restored from $KEY"
            else
              rm -f "$CACHE_DIR/$KEY.tar"
              rm -rf target
              echo "cache for $KEY was corrupt; removed, building cold"
            fi
          else
            echo "no cache for $KEY"
          fi

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked -p agenttrace-core -p agenttrace-tui -p agenttrace -- -D warnings

      - name: Lockfile enforcement (cargo --locked)
        run: scripts/ci/check-locked-cargo.sh

      - name: Save cargo target
        run: |
          KEY="cargo-$(sha256sum Cargo.lock | cut -c1-16)"
          CACHE_DIR="$RUNNER_TOOL_CACHE/../cargo-cache"
          mkdir -p "$CACHE_DIR"
          # rm-170: the cache is bounded (newest 3 lockfile keys, ~370M per
          # tar). Re-archiving an unchanged tree burned a full 369M write on
          # every lint run, so only re-tar when the restored cache is
          # missing or the build actually produced newer artifacts.
          if [ -f "$CACHE_DIR/$KEY.tar" ] \
            && ! find target -newer "$CACHE_DIR/$KEY.tar" -print -quit 2>/dev/null | grep -q .; then
            echo "cache for $KEY is current; skipping re-tar"
          else
            tar -cf "$CACHE_DIR/$KEY.tar" target
            echo "saved $KEY"
          fi
          ls -t "$CACHE_DIR"/*.tar 2>/dev/null | tail -n +4 | xargs -r rm -f

  full:
    # Full verification: everything beyond the lint surface — tests, the
    # release build, and all smoke scripts. Runs on push(master), nightly
    # schedule, and dispatch; NOT on pull_request (the `lint` job is the PR
    # gate). Artifacts upload unchanged.
    if: github.event_name != 'pull_request'
    name: Test and build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          # rm-173: same pin as the Lint job above / rust-toolchain.toml.
          toolchain: "1.98.1"

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked -p agenttrace-core -p agenttrace-tui -p agenttrace -- -D warnings

      - name: Rust tests
        run: cargo test --locked -p agenttrace-core -p agenttrace-tui -p agenttrace

      - name: Build CLI
        run: cargo build --release --locked -p agenttrace

      - name: Single binary CLI and TUI entrypoints
        run: cargo test --locked -p agenttrace --test entrypoints

      - name: Demo and report output contract
        run: |
          AGENTTRACE_BIN=target/release/agenttrace \
          AGENTTRACE_CI_OUT=ci-artifacts \
            scripts/ci/check-output-contract.sh

      - name: Deterministic demo output
        run: |
          AGENTTRACE_BIN=target/release/agenttrace \
          AGENTTRACE_CI_OUT=ci-artifacts \
            scripts/ci/check-deterministic-output.sh

      - name: Report semantic consistency
        run: |
          AGENTTRACE_BIN=target/release/agenttrace \
          AGENTTRACE_CI_OUT=ci-artifacts \
            scripts/ci/check-report-semantics.sh

      - name: Release surface drift
        run: scripts/ci/check-release-surfaces.sh

      - name: Example workflow supply-chain pinning
        run: scripts/ci/check-example-workflows.sh

      - name: Install runtime verification
        run: |
          AGENTTRACE_BIN=target/release/agenttrace \
            scripts/ci/check-install-runtime.sh

      - name: Documented command smoke tests
        run: |
          AGENTTRACE_BIN=target/release/agenttrace \
          AGENTTRACE_CI_OUT=ci-artifacts \
            scripts/ci/check-docs-commands.sh

      - name: Rust CLI fixture smoke
        run: |
          AGENTTRACE_BIN=target/release/agenttrace \
          AGENTTRACE_REAL_CLI_DIR=testdata \
          AGENTTRACE_REAL_CLI_QUERY=internal/ws \
          AGENTTRACE_REAL_CLI_FILE_LIMIT=20 \
          AGENTTRACE_REAL_CLI_OUT=ci-artifacts/real-cli-smoke \
            scripts/ci/check-rust-real-cli-smoke.sh

      - name: Rust TUI real-data smoke
        # Pass-11 A11-8 (N5/P4-5), fixed in cycle 7: this gate used to read
        # `env.AGENTTRACE_TUI_REAL_DIR != ''`, which is set nowhere in the
        # workflow, the job, or the step — a never-true condition that
        # silently disabled the PTY smoke. The gate is now the repository
        # variable of the same name: opt in by setting
        # AGENTTRACE_TUI_REAL_DIR in repo settings, and the step forwards
        # it to the script.
        if: vars.AGENTTRACE_TUI_REAL_DIR != ''
        env:
          AGENTTRACE_TUI_REAL_DIR: ${{ vars.AGENTTRACE_TUI_REAL_DIR }}
        run: |
          AGENTTRACE_BIN=target/release/agenttrace \
            scripts/ci/check-rust-tui-real-smoke.sh

      - name: Upload demo report artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agenttrace-ci-reports
          path: ci-artifacts
          if-no-files-found: warn

      - name: Validate Homebrew formula syntax
        run: ruby -c homebrew/Formula/agenttrace.rb

      - name: Test npm package contract
        run: npm --prefix npm test

      - name: Validate Cargo manifests
        run: scripts/ci/check-cargo-manifests.sh

      - name: Codex plugin version sync
        run: |
          # rm-163: the tag anchor needs tags; a fetch-depth:1 checkout has
          # none and the anchor would silently no-op. Fetch open, gate closed.
          git fetch --tags --quiet || true
          scripts/ci/check-plugin-version.sh

      - name: Validate helper scripts
        run: |
          bash -n scripts/record-demo.sh scripts/ci/*.sh
          sh -n install.sh

      - name: Lockfile enforcement (cargo --locked)
        run: scripts/ci/check-locked-cargo.sh

  deny:
    # rm-010, cycle 1 ("Trusted transport, gated supply chain"): dependency
    # policy gate — advisories (RUSTSEC), licenses, bans, sources — against
    # deny.toml at the repo root. Pattern from upstream PR #288 (merged
    # 2026-09-30); runs on every push/PR/schedule like upstream, independent
    # of the lint/full split (metadata-only, no compile, ~1min).
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check advisories, licenses, bans and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check
          arguments: --all-features
