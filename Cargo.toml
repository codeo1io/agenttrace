[workspace]
members = [
  "crates/agenttrace-core",
  "crates/agenttrace-cli",
  "crates/agenttrace-tui",
]
resolver = "2"

[workspace.package]
version = "0.0.0-dev"
edition = "2021"
# rm-386: the declared floor was 1.80 while the dependency graph has
# required ~1.88 for a while (ratatui 0.30 -> ratatui-crossterm 0.1.2 and
# zeroize 1.9.0 are edition-2024 crates with rust_version 1.88). A false
# floor tells builders "1.80 works" when it cannot even compile the
# deps. Upstream raised theirs to 1.85 (#303); this fork's real floor is
# higher. `cargo +1.80.1 check` must fail loudly at this guard.
# rm-166: `std::fs::File::lock` (the cross-process statusline journal
# serialization) stabilized in 1.89 — the floor follows the code.
rust-version = "1.89"
license = "MIT"
description = "Local-first TUI and reports for AI coding-agent session history, cost, tokens, time, and slow-run diagnosis."
repository = "https://github.com/luoyuctl/agenttrace"
homepage = "https://github.com/luoyuctl/agenttrace"
readme = "README.md"
keywords = ["agent", "observability", "tui", "cli", "ai"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "serde",
] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.30"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
# rm-803: `float_roundtrip` makes serde_json parse floats through a
# correctly-rounded path instead of the up-to-1-ULP-off fast default
# (upstream serde-rs/json#1336 marks the default best-effort by
# design). The session cache persists f64 metrics (costs, durations,
# credits) as JSON and the warm read used to re-parse those literals
# inexactly, so warm and cold loads disagreed on the last bit of
# cached money. All three crates inherit this declaration via
# `serde_json.workspace = true`, so one flip covers the workspace.
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2.0"
ureq = "2.12"
