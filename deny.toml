# cargo-deny configuration (rm-010, cycle 1 — "Trusted transport, gated
# supply chain"). Pattern carried from upstream luoyuctl/agenttrace PR #288
# (merged 2026-09-30), adapted verbatim: the fork's dependency tree is the
# upstream tree at the fork point, so the license allow-list fits as-is.
# The CI lane lives in .github/workflows/ci.yml (`deny` job).
# OpenSSF Scorecard IS enabled (rm-155, cycle 1 — "Truthful posture,
# enforced gates"): the earlier "remote is private" rationale was false —
# codeo1io/agenttrace is public (verified live 2026-09-30 via
# `gh repo view --json visibility,isPrivate`), so the lane lives in
# .github/workflows/scorecard.yml.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# rm-587 (run d65f72c7, 2026-10-06): cargo-deny v2 lets `informational =
# "unsound"` advisories through by default, so `check advisories` reported
# ok while RUSTSEC-2026-0253 (lru use-after-free, patched 0.18.2) sat in
# the DB with the lock pinned to 0.18.1 — a false clean. Soundness bugs
# are now considered for the whole tree.
#
# Integration note (2026-10-07, conflict case 39acfe43231b446f876b1cec36dff965):
# the landing originally shipped with a dated ignore carve-out for
# RUSTSEC-2026-0253 because the candidate's base (8991144) still pinned
# lru 0.18.1. The integration HEAD had already landed the rm-552 bump
# (lru 0.18.5 in Cargo.lock), so per the row's own removal rule ("drop the
# entry the moment the lock reaches >= 0.18.2") the carve-out was dropped
# at this merge and only the policy survives — the lane now flags an
# unsound advisory against the current lock, not past it.
unsound = "transitive"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "BSL-1.0",
]
exceptions = [
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
