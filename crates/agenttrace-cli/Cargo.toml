[package]
name = "agenttrace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[[bin]]
name = "agenttrace"
path = "src/main.rs"

[dependencies]
agenttrace-core = { version = "0.0.0-dev", path = "../agenttrace-core" }
agenttrace-tui = { version = "0.0.0-dev", path = "../agenttrace-tui" }
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
# rm-583: killpg for the upstream subprocess bound — no std API sends a
# signal to a process group, and the deadline kill must reach the whole
# tree (grandchildren hold the pipe write-ends). Already in the lockfile
# via crossterm; no new version enters the graph.
libc = "0.2"
